name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly, so a new advisory against a dependency shows up without a push

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    # A test mailbox, so that the tests of the mail client send through a real SMTP server and read what arrived.
    services:
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SSO_TEST_SMTP: 127.0.0.1:1025
      SSO_TEST_MAILPIT: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, openssl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:unit          # no database, no network: fails fast
      - run: composer test:integration   # SQLite, plus the test mailbox above

  mysql:
    name: MySQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sso_test
          MYSQL_USER: sso
          MYSQL_PASSWORD: sso
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usso -psso"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SSO_TEST_DATABASE: mysql://sso:sso@127.0.0.1:3306/sso_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, openssl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:integration

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['13', '17']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_DB: sso_test
          POSTGRES_USER: sso
          POSTGRES_PASSWORD: sso
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U sso -d sso_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SSO_TEST_DATABASE: pgsql://sso:sso@127.0.0.1:5432/sso_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, openssl, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:integration

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, openssl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer audit --locked --abandoned=report

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.production -t php-sso:ci .
