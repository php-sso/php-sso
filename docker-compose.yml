services:
  sso:
    container_name: php-sso-server
    build: .
    # Installs dependencies on first start (into ./vendor on the host), then serves.
    command: sh -c "[ -d vendor ] || composer install --no-interaction --no-progress; php -S 0.0.0.0:9000 -t public"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9000:9000"
    environment:
      SSO_PUBLIC_URL: http://localhost:9000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}   # only used when seeding an empty database
      SSO_DEMO_DATA: "1"                            # demo user, group and client; never in production
      SSO_DEBUG: "1"                                # show theme errors instead of falling back
      PHP_CLI_SERVER_WORKERS: "4"                   # php -S is single-threaded; back-channel logout calls the client, which calls back
    volumes:
      - .:/app

  # The other databases the app can use (`storage` in config/config.php), for running the test suite against them:
  #   docker compose --profile databases up -d
  #   docker compose exec -e SSO_TEST_DATABASE=mysql://sso:sso@mysql/sso_test sso vendor/bin/phpunit
  #   docker compose exec -e SSO_TEST_DATABASE=pgsql://sso:sso@postgres/sso_test sso vendor/bin/phpunit
  mysql:
    image: mysql:8.4
    profiles: [databases]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sso_test
      MYSQL_USER: sso
      MYSQL_PASSWORD: sso
    command: --skip-log-bin --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usso", "-psso"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17
    profiles: [databases]
    environment:
      POSTGRES_DB: sso_test
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
    command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Tiny demo app that logs in through the SSO server.
  client:
    container_name: php-sso-client
    build: .
    command: php -S 0.0.0.0:9001 -t client/public client/public/index.php
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9001:9001"
    environment:
      SSO_PUBLIC_URL: http://localhost:9000   # issuer; used by the browser
      SSO_INTERNAL_URL: http://sso:9000       # used for server-to-server calls
      CLIENT_URL: http://localhost:9001
      CLIENT_ID: demo-client
      CLIENT_SECRET: demo-secret
      CLIENT_SESSION_NAME: client_session
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - .:/app
    depends_on:
      - sso

  # A second demo app, to see single sign-on across apps: sign in on one, and the other needs no password.
  client2:
    container_name: php-sso-client2
    build: .
    command: php -S 0.0.0.0:9002 -t client/public client/public/index.php
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9002:9002"
    environment:
      SSO_PUBLIC_URL: http://localhost:9000
      SSO_INTERNAL_URL: http://sso:9000
      CLIENT_URL: http://localhost:9002
      CLIENT_ID: demo-client-2
      CLIENT_SECRET: demo-secret-2
      CLIENT_SESSION_NAME: client2_session
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - .:/app
    depends_on:
      - sso
