# The documentation of php-sso, built with the php-sso docs theme (github.com/php-sso/docs-theme).
# Preview: hugo server --source docs

baseURL = "https://php-sso.github.io/php-sso/"
title = "php-sso"
locale = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[outputs]
  home = ["html", "json"]

[params]
  description = "An OAuth 2.0 and OpenID Connect authorization server for PSR-7 / PSR-15 applications."
  accent = "core"
  repo = "https://github.com/php-sso/php-sso"
  editPath = "docs"
  license = "MIT"

[module]
  [[module.imports]]
    path = "github.com/php-sso/docs-theme"
