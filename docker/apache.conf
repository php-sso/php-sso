# Apache for the SSO image: serves public/ and sends everything that is not a file to index.php.
ServerTokens Prod
ServerSignature Off
Listen 8080

<VirtualHost *:8080>
    DocumentRoot /app/public
    FallbackResource /index.php
    # Pass the Authorization header (Basic client authentication at /token) to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /app/public>
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
